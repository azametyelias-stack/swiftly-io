# Continuous integration — SECURITY MASTERPLAN Point 18 (Dependencies Updated).
# Runs on every push to main and every pull request. The `audit` job fails the
# build on a known runtime vulnerability so a vulnerable dependency can never
# reach production unnoticed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit (fail on runtime vuln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Masterplan says `npm audit --production`; that flag is deprecated in
      # npm 7+ — `--omit=dev` is the current spelling. Only runtime deps gate
      # the build; a dev-only advisory is reported (continue-on-error) but does
      # not block a release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit dev dependencies (report only)
        run: npm audit --audit-level=moderate || true
