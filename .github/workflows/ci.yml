# Continuous integration — SECURITY MASTERPLAN.
# Runs on every push to main and every pull request.
#   verify — lint, types, tests, build.
#   audit  — fails on a known runtime vulnerability (Point 18) so a vulnerable
#            dependency can never reach production unnoticed.
#   sast   — Semgrep static analysis (defense-in-depth LAYER 1): scans the code
#            for injection / XSS / secret-leak / masterplan-convention breaks
#            before it can merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Types · Tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  audit:
    name: Dependency audit (fail on runtime vuln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Masterplan says `npm audit --production`; that flag is deprecated in
      # npm 7+ — `--omit=dev` is the current spelling. Only runtime deps gate
      # the build; a dev-only advisory is reported (continue-on-error) but does
      # not block a release.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit dev dependencies (report only)
        run: npm audit --audit-level=moderate || true

  sast:
    name: Semgrep (static analysis — defense LAYER 1)
    runs-on: ubuntu-latest
    # Official image ships the CLI + rule engine; pinned like node-version above.
    container:
      image: semgrep/semgrep:1.175.0
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan (fails on any ERROR finding)
        run: |
          semgrep scan \
            --error --severity=ERROR --metrics=off --disable-version-check \
            --config ./semgrep.yml \
            --config p/typescript \
            --config p/react \
            --config p/nextjs \
            --config p/owasp-top-ten \
            --config p/secrets
